name: GitHub Metrics

on:
  # Regenerate twice a day
  schedule:
    - cron: "0 */12 * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # Regenerate on push to the default branch
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Base metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: shahrayar123
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Karachi

          # Language breakdown
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss, jupyter notebook
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_sections: most-used

          # Contribution / commit habits
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_charts: yes
          plugin_habits_trim: yes

          # Activity calendar for the last year
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Most-starred repos
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 12
